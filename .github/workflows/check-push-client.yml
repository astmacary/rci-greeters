name: Check Greeters scheduling and notification consent
on:
  pull_request:
    paths: ['index.html', 'sw.js', 'push-client.js', 'test/**', '.github/workflows/check-push-client.yml']
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'push-client.js', 'test/**', '.github/workflows/check-push-client.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check push-client.js
      - run: node --test test/*.test.cjs
